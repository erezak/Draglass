# Use the installed pnpm; do not download a project-selected version.
pmOnFail: ignore
# Electron packaging needs a physical, hoisted node_modules tree.
nodeLinker: hoisted
overrides:
  "@electron/asar": "4.3.1"
  "@electron/get": "4.0.2"
  "sass": "1.105.1"
  "nanoid": "6.0.2"
  "global-agent": "4.1.3"
  "lodash-es": "^4.17.24"
  "katex": "^0.18.2"
  "sprintf-js": "^1.1.4"
# Preserve the existing explicit lifecycle-script decisions.
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  '@parcel/watcher': false
  fsevents: false
