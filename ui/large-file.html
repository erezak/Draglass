<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: draglass-asset:; font-src 'self' data:; connect-src 'none'; media-src 'self' draglass-asset:; frame-src draglass-asset:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Draglass Editor</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="large-file.css"></head><body class="large-window"><header class="file-heading"><h1 id="name">Opening…</h1><span id="scope" class="file-badge" hidden>Detached</span><button id="reload" hidden>Reload</button></header><div class="document-frame"><div id="document-viewport" tabindex="-1"><div id="large-editor"></div></div><div id="document-scrollbar" role="scrollbar" tabindex="0" aria-label="Scroll document" aria-controls="document-viewport" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="document-thumb"></div></div></div><footer id="status" role="status" aria-live="polite"></footer><dialog id="mermaid-dialog"><div class="diagram-dialog-heading"><div><span class="section-label">MERMAID</span><h2>Edit diagram</h2></div><button id="mermaid-close">Done</button></div><p class="muted">Edits save automatically to the note. Invalid syntax stays editable.</p><div class="mermaid-edit-layout"><textarea id="mermaid-source" spellcheck="false" aria-label="Mermaid source"></textarea><div id="mermaid-live-preview"></div></div><p id="mermaid-error" role="status"></p></dialog>
