[[permission]]
identifier = "list-markdown-files"
description = "Allows listing Markdown files in the selected vault."
commands.allow = ["list-markdown-files"]

[[permission]]
identifier = "list-markdown-files-legacy"
description = "Allows listing Markdown files in the selected vault (legacy command name)."
commands.allow = ["list_markdown_files"]

[[permission]]
identifier = "read-note"
description = "Allows reading a note from the selected vault."
commands.allow = ["read-note"]

[[permission]]
identifier = "read-note-legacy"
description = "Allows reading a note from the selected vault (legacy command name)."
commands.allow = ["read_note"]

[[permission]]
identifier = "write-note"
description = "Allows writing a note to the selected vault."
commands.allow = ["write-note"]

[[permission]]
identifier = "write-note-legacy"
description = "Allows writing a note to the selected vault (legacy command name)."
commands.allow = ["write_note"]

[[permission]]
identifier = "create-note"
description = "Allows creating a new note in the selected vault."
commands.allow = ["create-note"]

[[permission]]
identifier = "create-note-legacy"
description = "Allows creating a new note in the selected vault (legacy command name)."
commands.allow = ["create_note"]

[[permission]]
identifier = "rename-note"
description = "Allows renaming a note in the selected vault."
commands.allow = ["rename-note"]

[[permission]]
identifier = "rename-note-legacy"
description = "Allows renaming a note in the selected vault (legacy command name)."
commands.allow = ["rename_note"]

[[permission]]
identifier = "delete-note"
description = "Allows deleting a note in the selected vault."
commands.allow = ["delete-note"]

[[permission]]
identifier = "delete-note-legacy"
description = "Allows deleting a note in the selected vault (legacy command name)."
commands.allow = ["delete_note"]

[[permission]]
identifier = "create-dir"
description = "Allows creating a folder in the selected vault."
commands.allow = ["create-dir"]

[[permission]]
identifier = "create-dir-legacy"
description = "Allows creating a folder in the selected vault (legacy command name)."
commands.allow = ["create_dir"]

[[permission]]
identifier = "find-backlinks"
description = "Allows scanning the vault to find backlinks for a note."
commands.allow = ["find-backlinks"]

[[permission]]
identifier = "find-backlinks-legacy"
description = "Allows scanning the vault to find backlinks for a note (legacy command name)."
commands.allow = ["find_backlinks"]

[[permission]]
identifier = "read-vault-image"
description = "Allows reading an image asset from the selected vault."
commands.allow = ["read-vault-image"]

[[permission]]
identifier = "read-vault-image-legacy"
description = "Allows reading an image asset from the selected vault (legacy command name)."
commands.allow = ["read_vault_image"]

[[permission]]
identifier = "build-graph"
description = "Allows building the graph data from the selected vault."
commands.allow = ["build-graph"]

[[permission]]
identifier = "build-graph-legacy"
description = "Allows building the graph data from the selected vault (legacy command name)."
commands.allow = ["build_graph"]

[[permission]]
identifier = "search-vault"
description = "Allows searching the vault for content."
commands.allow = ["search-vault"]

[[permission]]
identifier = "search-vault-legacy"
description = "Allows searching the vault for content (legacy command name)."
commands.allow = ["search_vault"]

[[permission]]
identifier = "hash-vault-password"
description = "Allows hashing a password for vault authentication."
commands.allow = ["hash-vault-password"]

[[permission]]
identifier = "hash-vault-password-legacy"
description = "Allows hashing a password for vault authentication (legacy command name)."
commands.allow = ["hash_vault_password"]

[[permission]]
identifier = "verify-vault-password"
description = "Allows verifying a vault password."
commands.allow = ["verify-vault-password"]

[[permission]]
identifier = "verify-vault-password-legacy"
description = "Allows verifying a vault password (legacy command name)."
commands.allow = ["verify_vault_password"]

[[set]]
identifier = "vault"
description = "Allows the main window to access vault-related app commands."
permissions = [
  "list-markdown-files",
  "list-markdown-files-legacy",
  "read-note",
  "read-note-legacy",
  "write-note",
  "write-note-legacy",
  "create-note",
  "create-note-legacy",
  "rename-note",
  "rename-note-legacy",
  "delete-note",
  "delete-note-legacy",
  "create-dir",
  "create-dir-legacy",
  "find-backlinks",
  "find-backlinks-legacy",
  "read-vault-image",
  "read-vault-image-legacy",
  "build-graph",
  "build-graph-legacy",
  "search-vault",
  "search-vault-legacy",
  "hash-vault-password",
  "hash-vault-password-legacy",
  "verify-vault-password",
  "verify-vault-password-legacy",
]
